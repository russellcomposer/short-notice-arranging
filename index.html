<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Notice Arranging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: the form is a band part. A treble-clef staff runs across the top (Presto, 1/4); each question is one bar, a scale from C4 to C5, with its bar number boxed like a rehearsal mark. Highlighter marks what's done. */
:root{
  --paper:#F4F5F0;
  --card:#FFFFFF;
  --ink:#1A1D25;
  --ink-2:#555B68;
  --rule:#C6CAD1;
  --hi:#FFE14A;
  --hi-alpha:.6;
  --wall:#BCC1CA;
  --hi-ink:#1A1D25;
  --warn:#B23A22;
  --ok:#2E6B40;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --measure:34rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13151B;--card:#1C1F27;--ink:#ECEDE7;--ink-2:#A2A7B3;--rule:#3B404C;
    --hi:#EDCF35;--hi-alpha:.28;--wall:#343944;--hi-ink:#13151B;--warn:#F08068;--ok:#7FC793;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13151B;--card:#1C1F27;--ink:#ECEDE7;--ink-2:#A2A7B3;--rule:#3B404C;
  --hi:#EDCF35;--hi-alpha:.28;--wall:#343944;--hi-ink:#13151B;--warn:#F08068;--ok:#7FC793;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.55;margin:0}
.wrap{max-width:46rem;margin:0 auto;padding-inline:20px;padding-block:0 3rem}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--f-display);font-variation-settings:"wdth" 70;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;background:none;border:0;color:var(--ink);padding:0;cursor:pointer}
.brand:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.email-btn{font-family:var(--f-mono);font-size:.8rem;background:none;border:1px solid var(--rule);color:var(--ink);padding:6px 10px;border-radius:3px;cursor:pointer}
.email-btn:hover{border-color:var(--ink)}
.email-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- email panel ---------- */
.email-panel{margin-block:4px 10px;padding:14px 16px;border:1px solid var(--ink);background:var(--card);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:.95rem}
.email-panel .addr{font-family:var(--f-mono);font-size:.95rem;user-select:all;word-break:break-all}
.small-btn{font-family:var(--f-mono);font-size:.78rem;background:var(--ink);color:var(--paper);border:0;padding:6px 10px;border-radius:3px;cursor:pointer}
.small-btn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.email-panel a{color:var(--ink)}

/* ---------- staff progress: treble clef, Presto, 1/4, one crotchet per bar from C4 up to C5 ---------- */

.staff{margin-block:0 4px}
.staff svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.st-line{stroke:var(--ink);stroke-width:1.1}
.st-bar{stroke:var(--ink);stroke-width:1.3}
.st-thick{fill:var(--ink)}
.st-hi{fill:var(--hi);opacity:var(--hi-alpha)}
.st-clef{font-family:"PBT Clef","Noto Music","Bravura",serif;fill:var(--ink)}
.st-tempo{font-family:var(--f-body);font-style:italic;font-weight:600;fill:var(--ink)}
.st-time{font-family:var(--f-display);font-variation-settings:"wdth" 90;font-weight:900;fill:var(--ink)}
.st-note{fill:var(--rule)}.st-stem{stroke:var(--rule);stroke-width:1.4}.st-ledger{stroke:var(--rule);stroke-width:1.1}
.st-on .st-note{fill:var(--ink)}.st-on .st-stem,.st-on .st-ledger{stroke:var(--ink)}
.st-now .st-note{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:rotate(-20deg) scale(1)}50%{transform:rotate(-20deg) scale(1.18)}}
@media (prefers-reduced-motion: reduce){.st-now .st-note{animation:none}}
.st-syl{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}
.staff-label{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);margin-bottom:22px;text-align:right}

/* ---------- stage & transitions ---------- */
.stage{position:relative;overflow:hidden}
.screen{animation:in-r .38s cubic-bezier(.2,.7,.2,1) both}
.screen.back{animation-name:in-l}
@keyframes in-r{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes in-l{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.hl::before{animation:none!important}}

/* ---------- hero ---------- */
.hero{padding-block:22px 10px}
.hero h1{font-family:var(--f-display);font-variation-settings:"wdth" 64;font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:-.005em;font-size:clamp(3.4rem,13vw,6.6rem);margin:0 0 22px;text-wrap:balance}
.hl{position:relative;display:inline-block;z-index:0;color:var(--hi-ink)}
.hl::before{content:"";position:absolute;z-index:-1;left:-.06em;right:-.06em;top:.18em;bottom:.04em;background:var(--hi);transform-origin:left center;transform:skewX(-6deg);animation:swipe .7s .25s cubic-bezier(.3,.8,.3,1) both}
@keyframes swipe{from{transform:skewX(-6deg) scaleX(0)}to{transform:skewX(-6deg) scaleX(1)}}
.lede{font-size:1.25rem;line-height:1.45;max-width:var(--measure);margin:0 0 10px}
.sub{color:var(--ink-2);max-width:var(--measure);margin:0 0 26px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);margin-block:28px 30px}
.facts div{padding:12px 12px 14px 0}
.facts div+div{padding-left:12px;border-left:1px solid var(--rule)}
.facts b{display:block;font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em}
.facts span{font-size:.92rem;color:var(--ink-2)}
@media (max-width:560px){.facts{grid-template-columns:1fr}.facts div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule)}}
.or-email{font-size:.95rem;color:var(--ink-2);margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.or-email .addr{font-family:var(--f-mono);color:var(--ink);user-select:all;word-break:break-all}

/* ---------- question ---------- */
.q-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px}
.mark{flex:none;font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:800;font-size:1.25rem;line-height:1;border:2px solid var(--ink);padding:6px 8px 5px;min-width:2.2em;text-align:center}
.q-head h2{font-family:var(--f-display);font-variation-settings:"wdth" 78;font-weight:800;font-size:clamp(1.6rem,5vw,2.25rem);line-height:1.05;margin:0;text-wrap:balance;min-width:0}
.q-help{color:var(--ink-2);max-width:var(--measure);margin:6px 0 22px}

.opts{display:grid;gap:10px;max-width:var(--measure)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--rule);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);border-radius:3px;width:100%}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt .box{flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid var(--ink);border-radius:2px;position:relative}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .box,.opt[aria-checked="true"] .box{background:var(--hi)}
.opt[aria-pressed="true"] .box::after,.opt[aria-checked="true"] .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--hi-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt .t{min-width:0}
.opt .t small{display:block;color:var(--ink-2);font-size:.86rem;margin-top:2px}

label.f{display:block;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.03em;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical}
.field{margin-bottom:16px;max-width:var(--measure)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{min-width:0}
.date{display:grid;grid-template-columns:5rem minmax(0,1fr) 6.5rem;gap:8px;max-width:22rem}

.feedback{max-width:var(--measure);margin-top:6px;padding:12px 14px;border-left:4px solid var(--hi);background:var(--card);font-size:.98rem}
.feedback:empty{display:none}
.feedback.warn{border-left-color:var(--warn)}
.err{color:var(--warn);font-size:.95rem;margin-top:12px;min-height:1.4em;max-width:var(--measure)}

/* line-up */
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:8px;margin-bottom:14px}
.inst{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--rule);background:var(--card);border-radius:3px}
.inst.on{border-color:var(--ink)}
.inst .n{min-width:0;font-size:.98rem}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:32px;height:32px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:500 1.1rem/1 var(--f-mono);border-radius:3px;cursor:pointer}
.step button:hover{border-color:var(--ink)}
.step button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.step output{min-width:1.6em;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inst.on .step output{background:var(--hi);color:var(--hi-ink);border-radius:2px}
.lineup-sum{font-family:var(--f-mono);font-size:.88rem;padding:10px 12px;border:1px dashed var(--rule);margin-bottom:16px;word-break:break-word}

/* pieces */
.piece{border:1px solid var(--rule);background:var(--card);padding:14px;border-radius:3px;margin-bottom:12px;max-width:var(--measure)}
.piece-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.len{display:grid;grid-template-columns:5.5rem 5.5rem;gap:8px}

/* nav */
.nav{display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.go{font-family:var(--f-display);font-variation-settings:"wdth" 85;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1rem;background:var(--ink);color:var(--paper);border:0;padding:14px 22px;border-radius:3px;cursor:pointer}
.go:hover{background:var(--ink);box-shadow:4px 4px 0 var(--hi)}
.send-err{color:var(--warn);font-size:.95rem;margin:0 0 12px}
.send-err a{color:inherit}
.go[disabled]{opacity:.6;cursor:progress}
.go:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.back-btn{background:none;border:0;font:inherit;color:var(--ink-2);cursor:pointer;padding:6px 0}
.back-btn:hover{color:var(--ink)}
.back-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}

/* summary */
.sheet{border-top:2px solid var(--ink);margin-top:8px}
.sheet .r{display:grid;grid-template-columns:9rem minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.sheet .k{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.sheet .v{min-width:0;word-break:break-word}
@media (max-width:560px){.sheet .r{grid-template-columns:minmax(0,1fr) auto}.sheet .k{grid-column:1/-1}}
.quote{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:24px;border:2px solid var(--ink);background:var(--card)}
.quote>div{padding:16px 18px}
.quote>div+div{border-left:1px solid var(--rule)}
.quote .lab{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.quote .big{font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:900;font-size:2.1rem;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
.quote .big.word{font-size:1.5rem}
.quote p{margin:0;font-size:.9rem;color:var(--ink-2)}
@media (max-width:560px){.quote{grid-template-columns:1fr}.quote>div+div{border-left:0;border-top:1px solid var(--rule)}}
.terms{font-size:.9rem;color:var(--ink-2);margin-top:14px;max-width:var(--measure)}
.fine-mark{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-variation-settings:"wdth" 70;font-weight:900;font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

<script>
(function(){
const EMAIL = "russell.music.uk@gmail.com";
const MIN_FEE = 0;            // per-job minimum charge in £; 0 = off
const MIN_MINUTES = 3;
const NEW_ARR = 1.5;         // new arrangement / orchestration = rescue rate x 1.5
const MIN_PER_DAY = 5;      // minutes of finished music promised per working day

/* ---------- data ---------- */
const PROBLEMS = [
  ["absent","Someone can't make it","A player has dropped out and nobody can cover the part."],
  ["fewer","Fewer players than planned","The band on the night is smaller than the one the music was written for."],

];
const GROUPS = [
  ["wind","Concert or wind band"],["brass","Brass band"],["orch","Orchestra"],["wwstr","Strings with woodwind"],["strings","String orchestra"],["choir","Choir with band or orchestra","The choir stays as it is; the accompaniment is written for your players."],
  ["chamber","Small ensemble"],["other","Something else"]
];
const ORCH = [["fl","Flute"],["ob","Oboe"],["cl","Clarinet"],["bsn","Bassoon"],["hn","Horn"],["tpt","Trumpet"],["tbn","Trombone"],["tba","Tuba"],["timp","Timpani"],["perc","Percussion"],["hp","Harp"],["pno","Piano"],["vn1","Violin I"],["vn2","Violin II"],["va","Viola"],["vc","Cello"],["db","Double bass"]];
const INSTR = {
  wind:[["picc","Piccolo"],["fl","Flute"],["ob","Oboe"],["bsn","Bassoon"],["ebcl","Eb clarinet"],["cl1","1st clarinet"],["cl2","2nd clarinet"],["cl3","3rd clarinet"],["bcl","Bass clarinet"],["asx1","1st alto sax"],["asx2","2nd alto sax"],["tsx","Tenor sax"],["bsx","Baritone sax"],["tpt1","1st trumpet / cornet"],["tpt2","2nd trumpet / cornet"],["tpt3","3rd trumpet / cornet"],["hn1","1st horn in F"],["hn2","2nd horn in F"],["hn3","3rd horn in F"],["hn4","4th horn in F"],["tbn1","1st trombone"],["tbn2","2nd trombone"],["btbn","Bass trombone"],["euph","Euphonium"],["tba","Tuba"],["sb","String bass"],["timp","Timpani"],["perc","Percussion"],["kbd","Piano / keys"]],
  brass:[["sop","Soprano cornet"],["solo","Solo cornet"],["rep","Repiano cornet"],["cnt2","2nd cornet"],["cnt3","3rd cornet"],["flug","Flugelhorn"],["shn","Solo horn"],["thn1","1st horn"],["thn2","2nd horn"],["bar1","1st baritone"],["bar2","2nd baritone"],["tbn1","1st trombone"],["tbn2","2nd trombone"],["btbn","Bass trombone"],["euph","Euphonium"],["ebb","Eb bass"],["bbb","Bb bass"],["perc","Percussion"]],
  orch:ORCH,
  wwstr:ORCH,
  choir:ORCH,
  strings:[["vn1","Violin I"],["vn2","Violin II"],["va","Viola"],["vc","Cello"],["db","Double bass"],["pno","Piano"]],
  chamber:ORCH
};
const SHORT = {picc:"Picc",ebcl:"Eb Cl",cl1:"Cl 1",cl2:"Cl 2",cl3:"Cl 3",asx1:"A.Sx 1",asx2:"A.Sx 2",tpt1:"Tpt 1",tpt2:"Tpt 2",tpt3:"Tpt 3",hn1:"Hn 1",hn2:"Hn 2",hn3:"Hn 3",hn4:"Hn 4",tbn1:"Tbn 1",tbn2:"Tbn 2",sb:"Str.B",solo:"Solo Cnt",rep:"Rep",cnt2:"Cnt 2",cnt3:"Cnt 3",shn:"Solo Hn",thn1:"Hn 1",thn2:"Hn 2",bar1:"Bar 1",bar2:"Bar 2",fl:"Fl",ob:"Ob",cl:"Cl",bsn:"Bsn",hn:"Hn",tpt:"Tpt",tbn:"Tbn",tba:"Tba",timp:"Timp",perc:"Perc",hp:"Hp",pno:"Pno",vn1:"Vn I",vn2:"Vn II",va:"Va",vc:"Vc",db:"Db",bcl:"B.Cl",asx:"A.Sx",tsx:"T.Sx",bsx:"B.Sx",euph:"Euph",kbd:"Kbd",sop:"Sop.Cnt",cnt:"Cnt",flug:"Flug",thn:"T.Hn",bar:"Bar",btbn:"B.Tbn",ebb:"Eb Bass",bbb:"Bb Bass",s:"S",a:"A",t:"T",b:"B",kbd1:"Kbd 1",kbd2:"Kbd 2",reed:"Reeds",gtr:"Gtr",bass:"Bass",dr:"Dr",vn:"Vn"};
const MATERIALS = [
  ["score","Full score"],["parts","Parts"],["piano","Piano or vocal score","Orchestrating from a piano score is a new arrangement: arranging rates apply."],
  ["melody","Melody or lead sheet only","That makes it a new arrangement: arranging rates apply, plus one extra day."],
  ["audio","A recording only","A new arrangement: arranging rates apply, plus one extra day. The recording is checked before the job is confirmed."],
  ["none","Nothing yet","Something to work from is needed before the clock starts."]
];
const RIGHTS = [
  ["original","Original","Written by you or for you, and the composer agrees."],
  ["pd","Public domain","The composer died more than 70 years ago. If you're using a modern edition, the edition itself may still be in copyright."],
  ["cleared","Cleared","You have the publisher's permission to arrange it."],
  ["unsure","Not sure",""],
  ["licensed","A licensed show","From MTI, R&H, Concord or another licensor."]
];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const LONGDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- state ---------- */
const blank = () => ({
  step:0, editing:false,
  problems:[], problemOther:"",
  needBy:{d:"",m:"",y:""},
  group:"", lineup:{}, lineupOther:"", lineupNotes:"",
  pieces:[{title:"",composer:"",min:"",sec:""}],
  materials:[], rights:"",
  contact:{group:"",name:"",email:"",phone:""}
});
let S = (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.S) || blank();
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try{ window.claude.hot.snapshot(() => ({S})); }catch(e){} }

const $ = (s, el=document) => el.querySelector(s);
const stage = $("#stage");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dates ---------- */
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function toDate(o){ if(!o.d||!o.m||!o.y) return null; const d=new Date(+o.y,+o.m-1,+o.d); return d.getMonth()===+o.m-1 ? d : null; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmt(d){ return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }

/* ---------- calculations ---------- */
function totalMinutes(){
  return S.pieces.reduce((s,p)=> s + (parseFloat(p.min)||0) + (parseFloat(p.sec)||0)/60, 0);
}
function partsCount(){ return Object.values(S.lineup).filter(n=>n>0).length; }
function playersCount(){ return Object.values(S.lineup).reduce((s,n)=>s+(n||0),0); }
/* Launch rates, £ per minute of finished music.
   Quartet base £49; each instrument beyond four +15% of base; piano +20% on any line-up;
   band, woodwind-and-strings and full orchestra are the old launch rates +20%. */
const R = {quartet:49, perExtra:0.15, piano:0.20, band:74.40, fullOrch:90, wwStrings:70.20, wwExtra:9};
function withPiano(r, label, piano){
  return piano ? {r:Math.round(r*(1+R.piano)*100)/100, label:label+" with piano"} : {r, label};
}
const STR={vn1:8,vn2:6,va:5,vc:4,db:2};
const DEFAULTS = {
  wind:{picc:1,fl:2,ob:1,bsn:1,cl1:3,cl2:3,cl3:2,bcl:1,asx1:1,asx2:1,tsx:1,bsx:1,tpt1:2,tpt2:2,tpt3:1,hn1:1,hn2:1,hn3:1,hn4:1,tbn1:1,tbn2:1,btbn:1,euph:1,tba:2,timp:1,perc:2},
  orch:Object.assign({fl:2,ob:2,cl:2,bsn:2,hn:4,tpt:2,tbn:3,tba:1,timp:1,perc:2},STR),
  wwstr:Object.assign({fl:2,ob:2,cl:2,bsn:2,hn:2},STR),
  strings:Object.assign({},STR)
};
function orchRate(){
  const L=S.lineup, has=k=>(L[k]||0)>0;
  if (has("tpt")||has("tbn")||has("tba")) return withPiano(R.fullOrch,"Full orchestra",has("pno"));
  const base={fl:2,ob:2,cl:2,bsn:2,hn:2,perc:2,timp:2};
  let extra = has("hp") ? 1 : 0;
  for(const k in base){ if((L[k]||0)>base[k]) extra++; }
  return withPiano(R.wwStrings+R.wwExtra*extra,"Woodwind and string orchestra",has("pno"));
}
function chamberRate(){
  const L=S.lineup, has=k=>(L[k]||0)>0, pianoKey="pno";
  const n = Object.entries(L).filter(([k,v])=>v>0 && k!==pianoKey).reduce((s,[,v])=>s+v,0);
  if (n===0 && !has(pianoKey)) return null;
  const r = Math.round(R.quartet*(1+R.perExtra*Math.max(0,n-4))*100)/100;
  return withPiano(r, Math.max(n,1)+"-instrument ensemble", has(pianoKey));
}
function rate(){
  const L=S.lineup, has=k=>(L[k]||0)>0;
  switch(S.group){
    case "wind": return withPiano(R.band,"Wind band",has("kbd"));
    case "brass": return {r:R.band,label:"Brass band"};
    case "strings": return withPiano(R.quartet,"String orchestra",has("pno"));
    case "orch": case "wwstr": return orchRate();
    case "chamber": return chamberRate();
    case "choir": {
      // accompaniment for a choir: whichever is lower of the per-instrument and the orchestral rate
      const a=chamberRate(), b=orchRate();
      if(!a) return null;
      const best = (b && b.r < a.r) ? b : a;
      return {r:best.r, label:"Choral accompaniment, "+best.label.charAt(0).toLowerCase()+best.label.slice(1)};
    }
    default: return null;
  }
}
function isNewArrangement(){ return !S.materials.some(m=>["score","parts"].includes(m)); }
function estimate(){
  const rt = rate(); const mins = totalMinutes();
  if(!rt || mins<=0) return null;
  const fresh = isNewArrangement();
  const r = fresh ? Math.round(rt.r*NEW_ARR*100)/100 : rt.r;
  const label = fresh ? "New arrangement, "+rt.label.charAt(0).toLowerCase()+rt.label.slice(1) : rt.label;
  const billed = Math.max(MIN_MINUTES, mins);
  const fee = Math.max(MIN_FEE, Math.round(r*billed));
  return {fee, rt:{r,label}, billed};
}
function workDays(){
  const mins = totalMinutes();
  let d = Math.max(1, Math.ceil(mins/MIN_PER_DAY - 1e-9));
  if (S.materials.includes("melody") || S.materials.includes("audio")) {
    const full = S.materials.some(m=>["score","parts","piano"].includes(m));
    if(!full) d += 1;
  }
  return d;
}
function deliveryDate(){ return addDays(today(), workDays()+1); }
function money(n){ return "£"+n.toLocaleString("en-GB",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
function lineupText(){
  const list = INSTR[S.group]||[];
  const bits = list.filter(([k])=>S.lineup[k]>0).map(([k])=>S.lineup[k]+" "+(SHORT[k]||k));
  return bits.join(", ");
}

/* ---------- staff ---------- */
const STAFF = {W:800, H:104, top:44, gap:10, x0:70, x1:792};
const SCALE = [["C",94,"do"],["D",89,"re"],["E",84,"mi"],["F",79,"fa"],["G",74,"sol"],["A",69,"la"],["B",64,"si"],["C",59,"do"]];
function drawStaff(){
  const wrap=$("#staffWrap"), staff=$("#staff"), lab=$("#staffLabel");
  const s=S.step;
  const show = typeof s==="number" && s>=1 && s<=9;
  wrap.hidden = !show;
  if(!show) return;
  const {H,top,gap,x0}=STAFF, bot=top+4*gap;
  const cw = staff.getBoundingClientRect().width || 800;
  const w = cw<560 ? 50 : (STAFF.x1-6-x0)/8;      // narrower bars on phones so the staff stays legible
  const x1 = x0+8*w+6, W = x1;
  let g='';
  for(let i=0;i<8;i++){ if(i+1<s) g+='<rect class="st-hi" x="'+(x0+i*w+3)+'" y="'+(top-4)+'" width="'+(w-6)+'" height="'+(4*gap+8)+'"/>'; }
  for(let i=0;i<5;i++){ const y=top+i*gap; g+='<line class="st-line" x1="0" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/>'; }
  g+='<line class="st-bar" x1="0" y1="'+top+'" x2="0" y2="'+bot+'"/>';
  g+='<text class="st-clef" x="5" y="'+bot+'" font-size="40">\u{1D11E}</text>';
  g+='<text class="st-tempo" x="0" y="20" font-size="17">Presto</text>';
  g+='<text class="st-time" x="52" y="'+(top+2*gap-1)+'" font-size="23" text-anchor="middle">1</text>';
  g+='<text class="st-time" x="52" y="'+(bot-1)+'" font-size="23" text-anchor="middle">4</text>';
  for(let i=1;i<8;i++){ const x=x0+i*w; g+='<line class="st-bar" x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+bot+'"/>'; }
  g+='<line class="st-bar" x1="'+(x1-6)+'" y1="'+top+'" x2="'+(x1-6)+'" y2="'+bot+'"/><rect class="st-thick" x="'+(x1-3.5)+'" y="'+top+'" width="3.5" height="'+(4*gap)+'"/>';
  SCALE.forEach(([n,y,syl],i)=>{
    const bar=i+1, cx=x0+i*w+w/2;
    const cls = bar<s||s===9 ? "st-on" : bar===s ? "st-on st-now" : "";
    let note='<g class="'+cls+'">';
    if(y>=bot+gap){ note+='<line class="st-ledger" x1="'+(cx-11)+'" y1="'+y+'" x2="'+(cx+11)+'" y2="'+y+'"/>'; }
    const up = y>top+2*gap;
    note+= up ? '<line class="st-stem" x1="'+(cx+5.6)+'" y1="'+(y-1)+'" x2="'+(cx+5.6)+'" y2="'+(y-35)+'"/>'
              : '<line class="st-stem" x1="'+(cx-5.6)+'" y1="'+(y+1)+'" x2="'+(cx-5.6)+'" y2="'+(y+35)+'"/>';
    note+='<ellipse class="st-note" cx="'+cx+'" cy="'+y+'" rx="6.3" ry="4.4" transform="rotate(-20 '+cx+' '+y+')"/>';
    note+='</g>';

function next(){

}

/* ---------- validation ---------- */
function setErr(msg){ const e=$("#err"); if(e) e.textContent=msg||""; return !msg; }
function validate(){
  const s=S.step;
  if(s===1){
    if(!S.problems.length) return setErr("Pick at least one.");
    if(S.problems.includes("other") && !S.problemOther.trim()) return setErr("Say briefly what's gone wrong.");
  }
  if(s===2){
    const n=toDate(S.needBy);
    if(!n) return setErr("Add the date you need the parts by.");
    if(n<today()) return setErr("That date has already passed.");
  }
  if(s===3 && !S.group) return setErr("Choose the kind of group.");
  if(s===4){
    if(S.group==="other"){ if(!S.lineupOther.trim()) return setErr("List the instruments you'll have."); }
    else if(!playersCount()) return setErr("Add at least one player.");
  }
  if(s===5){
    for(const [i,p] of S.pieces.entries()){
      if(!p.title.trim()) return setErr("Add a title for piece "+(i+1)+".");
      if(!((parseFloat(p.min)||0)+(parseFloat(p.sec)||0))) return setErr("Add a rough length for piece "+(i+1)+".");
    }
  }
  if(s===6 && !S.materials.length) return setErr("Tick what you've got, even if it's nothing yet.");
  if(s===7 && !S.rights) return setErr("Choose one.");
  if(s===8){
    const c=S.contact;
    if(!c.group.trim()) return setErr("Add the group's name.");
    if(!c.name.trim()) return setErr("Add your name.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) return setErr("That email address doesn't look complete.");
  }
  return setErr("");
}

  on("[data-copy]","click",copyHandler);

  on("[data-prob]","click",e=>{
    const k=e.currentTarget.dataset.prob, i=S.problems.indexOf(k);
    if(i>=0) S.problems.splice(i,1); else S.problems.push(k);
    e.currentTarget.setAttribute("aria-pressed", String(i<0));
    $("#otherWrap",el).hidden = !S.problems.includes("other");
    setErr("");
  });
  on("#probOther","input",e=>S.problemOther=e.target.value);

  ["need"].forEach(id=>{
    const key = "needBy";
    ["d","m","y"].forEach(p=>{
      const s=el.querySelector("#"+id+"-"+p); if(!s) return;
      s.addEventListener("change",()=>{ S[key][p]=s.value; dateFeedback(); setErr(""); });
    });
  });

  on("[data-grp]","click",e=>{
    const k=e.currentTarget.dataset.grp;
    if(S.group!==k){ S.group=k; S.lineup=Object.assign({},DEFAULTS[k]||{}); }
    el.querySelectorAll("[data-grp]").forEach(b=>b.setAttribute("aria-checked", String(b.dataset.grp===k)));
    setErr("");
  });

  on("[data-inc],[data-dec]","click",e=>{
    const k=e.currentTarget.dataset.inc||e.currentTarget.dataset.dec;
    const v=Math.max(0,Math.min(40,(S.lineup[k]||0)+(e.currentTarget.dataset.inc?1:-1)));
    S.lineup[k]=v;
    $("#o-"+k,el).textContent=v;
    e.currentTarget.closest(".inst").classList.toggle("on",v>0);
    lineupFeedback(); setErr("");
  });
  on("#lineupOther","input",e=>S.lineupOther=e.target.value);
  on("#lineupNotes","input",e=>S.lineupNotes=e.target.value);

  on("[data-p]","input",e=>{
    const t=e.target; S.pieces[+t.dataset.p][t.dataset.f]=t.value; lengthFeedback();
  });
  on("#addPiece","click",()=>{ S.pieces.push({title:"",composer:"",min:"",sec:""}); render(); const i=S.pieces.length-1; const f=$("#pt-"+i); if(f) f.focus(); });
  on("[data-rm]","click",e=>{ S.pieces.splice(+e.currentTarget.dataset.rm,1); render(); });

  on("[data-mat]","click",e=>{
    const k=e.currentTarget.dataset.mat, i=S.materials.indexOf(k);
    if(i>=0) S.materials.splice(i,1); else S.materials.push(k);
    e.currentTarget.setAttribute("aria-pressed", String(i<0)); setErr("");
  });
  on("[data-rt]","click",e=>{
    const k=e.currentTarget.dataset.rt; S.rights=k;
    el.querySelectorAll("[data-rt]").forEach(b=>b.setAttribute("aria-checked", String(b.dataset.rt===k))); setErr("");
  });

  const cmap={cGroup:"group",cName:"name",cEmail:"email",cPhone:"phone"};
  Object.keys(cmap).forEach(id=>{ const f=el.querySelector("#"+id); if(f) f.addEventListener("input",()=>S.contact[cmap[id]]=f.value); });
}

/* ---------- global ---------- */
function copyHandler(e){
  const btn=e.currentTarget, text=btn.dataset.copy;
  const done=()=>{ const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1400); };
  const fallback=()=>{ const r=document.createRange(); const n=btn.previousElementSibling; if(n){ r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent="Selected"; setTimeout(()=>btn.textContent="Copy",1400);} };
  try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(err){ fallback(); }
}
document.querySelectorAll("#emailPanel [data-copy]").forEach(b=>b.addEventListener("click",copyHandler));
$("#emailToggle").addEventListener("click",()=>{
  const p=$("#emailPanel"); p.hidden=!p.hidden; $("#emailToggle").setAttribute("aria-expanded",String(!p.hidden));
});
$("#brand").addEventListener("click",()=>go(0,true));
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter" || e.shiftKey) return;
  const t=e.target;
  if(t && (t.tagName==="TEXTAREA" || t.tagName==="BUTTON" || t.tagName==="A" || t.tagName==="SELECT")) return;
  if(typeof S.step==="number" && S.step>=1 && S.step<=8){ e.preventDefault(); next(); }
});

let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawStaff,120); });
render();
})();
</script>

</html>
